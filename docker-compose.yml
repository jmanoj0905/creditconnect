services:
  db:
    image: postgres:16
    container_name: creditconnect-db
    environment:
      POSTGRES_DB: creditconnect
      POSTGRES_USER: creditconnect
      POSTGRES_PASSWORD: creditconnect
    ports:
      - "5432:5432"
    volumes:
      - creditconnect-data:/var/lib/postgresql/data

volumes:
  creditconnect-data:
