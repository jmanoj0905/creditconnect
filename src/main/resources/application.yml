spring:
  application:
    name: creditconnect
  datasource:
    url: jdbc:postgresql://localhost:5432/creditconnect
    username: creditconnect
    password: creditconnect
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    com.creditconnect: DEBUG
